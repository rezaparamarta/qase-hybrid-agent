name: Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # daily 01:00 UTC

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      BASE_URL: https://www.saucedemo.com
      QASE_PROJECT: SDEMO
      QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      # Report to Qase only when the token is available (not on PRs from forks).
      QASE_MODE: ${{ secrets.QASE_API_TOKEN != '' && 'testops' || 'off' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --grep-invert @known-bug # known bugs stay red locally, not in CI

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
